
services:
  db:
    image: postgres:17
    container_name: orderly-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: orderly
      POSTGRES_USER: orderly_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - orderly_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderly_user -d orderly"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  orderly_postgres:
